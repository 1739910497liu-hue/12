model:
  base_learning_rate: 5.0e-5
  target: ldm.models.diffusion.ddpm.LatentDiffusion
  params:
    linear_start: 0.0015
    linear_end: 0.0155
    num_timesteps_cond: 1
    log_every_t: 200
    timesteps: 1000
    loss_type: l1
    first_stage_key: image
    cond_stage_key: caption
    image_size: 32
    channels: 4
    cond_stage_trainable: false
    concat_mode: false
    conditioning_key: crossattn
    scale_by_std: true
    monitor: val/loss_simple_ema

    scheduler_config:
      target: ldm.lr_scheduler.LambdaLinearScheduler
      params:
        warm_up_steps: [10000]
        cycle_lengths: [10000000000000]
        f_start: [1.e-6]
        f_max: [1.]
        f_min: [1.]

    unet_config:
      target: ldm.modules.diffusionmodules.openaimodel.UNetModel
      params:
        image_size: 32
        in_channels: 4
        out_channels: 4
        model_channels: 192
        attention_resolutions: [1, 2, 4, 8]
        num_res_blocks: 2
        channel_mult: [1, 2, 2, 4, 4]
        num_heads: 8
        use_scale_shift_norm: true
        resblock_updown: true
        use_spatial_transformer: true
        transformer_depth: 1
        context_dim: 512

    first_stage_config:
      target: ldm.models.autoencoder_large2.SymmetricVQModel
      params:
        embed_dim: 4
        n_embed: 16384
        monitor: val/rec_loss
        ckpt_path: /root/autodl-tmp/TIGLDM6v3/logs/Base/2026-07-30T11-14-43_symmetric_vqgan/checkpoints/last-v1.ckpt
        ddconfig:
          double_z: false
          z_channels: 4
          resolution: 256
          in_channels: 3
          out_ch: 3
          ch: 128
          ch_mult: [1, 2, 4, 4]
          num_res_blocks: 2
          attn_resolutions: []
          dropout: 0.0
        lossconfig:
          target: torch.nn.Identity

    cond_stage_config:
      target: ldm.modules.encoders.modules.FrozenCLIPEmbedder
      params:
        version: /root/autodl-tmp/TIGLDM6v3/models/clip/clip-vit-base-patch32
        max_length: 77
        freeze: true
        local_files_only: true

data:
  target: main.DataModuleFromConfig
  params:
    batch_size: 4
    num_workers: 4
    wrap: false
    train:
      target: ldm.data.imagenet.SS304SRTrain
      params:
        data_root: /root/autodl-tmp/TIGLDM6v3/datasets/ss304/train
        size: 256
        image_read_mode: resize
        degradation: pil_nearest
        Cf_r: 1.0
        caption_file: /root/autodl-tmp/TIGLDM6v3/datasets/text/train_text.json
        default_caption: SS304 TIG weld thermal source image
    validation:
      target: ldm.data.imagenet.SS304SRValidation
      params:
        data_root: /root/autodl-tmp/TIGLDM6v3/datasets/ss304/valid
        size: 256
        image_read_mode: resize
        degradation: pil_nearest
        Cf_r: 1.0
        caption_file: /root/autodl-tmp/TIGLDM6v3/datasets/text/valid.json
        default_caption: SS304 TIG weld thermal source image

lightning:
  callbacks:
    image_logger:
      target: main.ImageLogger
      params:
        batch_frequency: 1000
        max_images: 4
        increase_log_steps: false

  trainer:
    benchmark: true
    accumulate_grad_batches: 2
