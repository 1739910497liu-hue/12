model:
  base_learning_rate: 4.5e-6
  target: ldm.models.autoencoder_large2.VQModelWithMask
  params:
    monitor: val/rec_loss
    embed_dim: 4
    n_embed: 16384
    recompute_quant_loss: True
    quant_loss_beta: 0.25

    scheduler_config:
      target: ldm.lr_scheduler.LambdaWarmUpCosineScheduler
      params:
        verbosity_interval: 0
        warm_up_steps: 1000
        lr_start: 0.01
        lr_min: 0.0
        lr_max: 1
        max_decay_steps: 200000

    lossconfig:
      target: ldm.modules.losses.vqperceptual.VQLPIPSWithDiscriminator
      params:
        disc_conditional: false
        disc_in_channels: 3
        disc_num_layers: 2
        disc_start: 10000
        disc_ramp_steps: 5000
        disc_factor: 0.25
        disc_weight: 0.05
        d_weight_max: 0.5
        codebook_weight: 1.0

    ddconfig:
      double_z: false
      z_channels: 4
      resolution: 256
      in_channels: 3
      out_ch: 3
      ch: 128
      ch_mult: [1, 2, 4, 4]
      num_res_blocks: 2
      attn_resolutions: []
      dropout: 0.0

data:
  target: main.DataModuleFromConfig
  params:
    batch_size: 8
    num_workers: 4
    wrap: true
    train:
      target: ldm.data.imagenet.LaserWeldingSRTrain
      params:
        data_root: H:/数据集/laserwelding/train
        label_json: H:/数据集/laserwelding/train/train.json
        size: 256
        image_read_mode: resize
        degradation: pil_nearest
        Cf_r: 0.0
        mask_mode: ellipse
        ellipse_params:
          random_center: true
          min_radius_x: 42.0
          max_radius_x: 110.0
          min_radius_y: 28.0
          max_radius_y: 88.0
          random_angle: true
          angle_min_deg: 0.0
          angle_max_deg: 360.0
    validation:
      target: ldm.data.imagenet.LaserWeldingSRValidation
      params:
        data_root: H:/数据集/laserwelding/validation
        label_json: H:/数据集/laserwelding/validation/validation.json
        size: 256
        image_read_mode: resize
        degradation: pil_nearest
        Cf_r: 0.0
        mask_mode: ellipse
        ellipse_params:
          random_center: true
          min_radius_x: 42.0
          max_radius_x: 110.0
          min_radius_y: 28.0
          max_radius_y: 88.0
          random_angle: true
          angle_min_deg: 0.0
          angle_max_deg: 360.0

lightning:
  callbacks:
    early_stopping:
      target: main.EarlyStopping
      params:
        monitor: val/rec_loss
        mode: min
        patience: 3
        min_delta: 0.001
        verbose: true
        check_finite: true
    image_logger:
      target: main.ImageLogger
      params:
        batch_frequency: 500
        max_images: 4
        increase_log_steps: true

  trainer:
    benchmark: true
    accumulate_grad_batches: 1
