model:
  base_learning_rate: 4.5e-6
  target: ldm.models.autoencoder_large2.VQModelWithMask
  params:
    monitor: val/rec_loss
    embed_dim: 4
    n_embed: 16384
    recompute_quant_loss: True
    quant_loss_beta: 0.25

    scheduler_config:
      target: ldm.lr_scheduler.LambdaWarmUpCosineScheduler
      params:
        verbosity_interval: 0
        warm_up_steps: 1000
        lr_start: 0.01
        lr_min: 0.0
        lr_max: 1
        max_decay_steps: 200000

    lossconfig:
      target: ldm.modules.losses.vqperceptual.VQLPIPSWithDiscriminator
      params:
        disc_conditional: false
        disc_in_channels: 3
        disc_num_layers: 2
        disc_start: 10000
        disc_ramp_steps: 5000
        disc_factor: 0.25
        disc_weight: 0.05
        d_weight_max: 0.5
        codebook_weight: 1.0

    ddconfig:
      double_z: False
      z_channels: 4
      resolution: 256
      in_channels: 3
      out_ch: 3
      ch: 128
      ch_mult: [ 1,2,4,4 ]
      num_res_blocks: 2
      attn_resolutions: [ ]
      dropout: 0.0

data:
  target: main.DataModuleFromConfig
  params:
    batch_size: 8
    wrap: True
    train:
      target: ldm.data.imagenet.SS304SRTrain
      params:
        data_root: datasets/ss304/train
        size: 256
        image_read_mode: resize
        degradation: pil_nearest
        Cf_r: 0.0
        mask_mode: ellipse
        ellipse_params:
          random_center: True
          min_radius_x: 42.0
          max_radius_x: 110.0
          min_radius_y: 28.0
          max_radius_y: 88.0
          random_angle: True
          angle_min_deg: 0.0
          angle_max_deg: 360.0
    validation:
      target: ldm.data.imagenet.SS304SRValidation
      params:
        data_root: datasets/ss304/valid
        size: 256
        image_read_mode: resize
        degradation: pil_nearest
        Cf_r: 0.0
        mask_mode: ellipse
        ellipse_params:
          random_center: True
          min_radius_x: 42.0
          max_radius_x: 110.0
          min_radius_y: 28.0
          max_radius_y: 88.0
          random_angle: True
          angle_min_deg: 0.0
          angle_max_deg: 360.0

lightning:
  callbacks:
    image_logger:
      target: main.ImageLogger
      params:
        batch_frequency: 500
        max_images: 4
        increase_log_steps: True

  trainer:
    benchmark: True
    accumulate_grad_batches: 1
